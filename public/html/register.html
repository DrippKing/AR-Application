<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro — WorldScan 2026</title>
  <link rel="stylesheet" href="/css/scanner.css">
  <link rel="stylesheet" href="/css/login.css"> <!-- Reutilizamos el CSS del login -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <header class="topbar">
    <a href="/home" class="brand-link">
      <div class="brand">
        <img src="/assets/logo.png" alt="WorldScan 2026 Logo" class="brand-ball" />
      </div>
    </a>
    <a href="/login" class="topbar-btn">Ya tengo una cuenta</a>
  </header>

  <main class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h2>Crear una cuenta</h2>
        <p class="muted">Regístrate para guardar tu progreso y acceder a todas las funciones.</p>
      </div>

      <form id="register-form">
        <div class="input-group">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <input type="text" id="name" name="name" placeholder="Nombre completo" required>
        </div>

        <div class="input-group">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          <input type="email" id="email" name="email" placeholder="Correo Electrónico" required>
        </div>

        <div class="input-group">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <input type="password" id="password" name="password" placeholder="Contraseña" required>
        </div>

        <div class="form-actions">
          <button type="submit" class="primary-btn">Crear cuenta</button>
        </div>
      </form>

      <div class="login-footer">
        <p>¿Ya tienes una cuenta? <a href="/login">Inicia sesión</a></p>
      </div>
    </div>
  </main>

  <script src="/js/register.js"></script>
</body>
</html>
