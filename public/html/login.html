<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — WorldScan 2026</title>
  <link rel="stylesheet" href="/css/scanner.css">
  <link rel="stylesheet" href="/css/login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Topbar consistente con el resto del sitio -->
  <header class="topbar">
    <a href="/home" class="brand-link">
      <div class="brand">
        <img src="/assets/trionda_ball.png" alt="Balón WorldScan 2026" class="brand-ball">
        <div class="brand-text">
          <span class="brand-title">WorldScan</span>
          <span class="brand-year">2026</span>
        </div>
      </div>
    </a>
    <a href="/scanner" class="topbar-btn">Continuar sin cuenta</a>
  </header>
  <!-- Contenedor principal para centrar el formulario -->
  <main class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h2>Iniciar Sesión</h2>
        <p class="muted">Ingresa tus credenciales para acceder a tu perfil.</p>
      </div>

      <form id="login-form">
        <div class="input-group">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          <input type="email" id="email" name="email" placeholder="Correo Electrónico" required>
        </div>

        <div class="input-group">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <input type="password" id="password" name="password" placeholder="Contraseña" required>
        </div>

        <div class="form-actions">
          <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
          <button type="submit" class="primary-btn">Ingresar</button>
        </div>
      </form>

      <div class="login-footer">
        <p>¿No tienes una cuenta? <a href="#">Regístrate aquí</a></p>
      </div>
    </div>
  </main>

  <script src="/js/auth.js"></script>
</body>
</html>
