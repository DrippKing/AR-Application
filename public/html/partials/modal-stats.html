<div class="modal-card stats-modal" role="dialog" aria-modal="true" aria-labelledby="stats-title">
  <button class="modal-close" type="button" data-close aria-label="Cerrar">✕</button>

  <h2 id="stats-title">📊 Estadísticas</h2>

  <div id="stats-content" class="stats-content">
    <!-- Aquí stats.js renderiza dinámicamente -->
    <div class="stats-empty">
      <div class="stats-empty-icon">📊</div>
      <h3 class="stats-empty-title">Cargando datos...</h3>
      <p class="stats-empty-text">Buscando estadísticas del país en la base de datos.</p>
    </div>
  </div>

  <div class="video-footer">
    <small>Estadísticas dinámicas por país detectado.</small>
  </div>
</div>
