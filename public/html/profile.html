<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil — WorldScan 2026</title>
  <link rel="stylesheet" href="/css/scanner.css">
  <link rel="stylesheet" href="/css/profile.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <header class="topbar">
    <a href="/home" class="brand-link">
      <div class="brand">
        <img src="/assets/trionda_ball.png" alt="Balón WorldScan 2026" class="brand-ball">
        <div class="brand-text">
          <span class="brand-title">WorldScan</span>
          <span class="brand-year">2026</span>
        </div>
      </div>
    </a>
    <a href="/scanner" class="topbar-btn">Ir al escáner</a>
  </header>

  <main class="profile-container">
    <div class="profile-card">
      <div class="profile-header">
        <div class="profile-avatar">
          <span id="profile-initials">--</span>
        </div>
        <h2 id="profile-name">Cargando...</h2>
        <p id="profile-email" class="muted">Cargando correo...</p>
      </div>

      <div class="stats-grid">
        <div class="stat-item">
          <span class="stat-label">Puntos Acumulados</span>
          <span id="profile-points" class="stat-value">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Países Escaneados</span>
          <span class="stat-value">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Trivias Completadas</span>
          <span class="stat-value">0</span>
        </div>
      </div>

      <div class="profile-actions">
        <button id="logout-btn" class="logout-btn">Cerrar Sesión</button>
      </div>
    </div>
  </main>

  <script src="/js/profile.js"></script>
</body>
</html>
