<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mi Perfil — WorldScan 2026</title>

  <!-- Estilos de la landing page para consistencia visual -->
  <link rel="stylesheet" href="/css/landing.css" />
  <!-- Estilos generales para botones y otros elementos -->
  <link rel="stylesheet" href="/css/styles.css" />

  <style>
    /* Estilos específicos para la página de perfil */
    .profile-section {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }

    .profile-card {
      background: rgba(22, 24, 22, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      backdrop-filter: blur(10px);
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    .profile-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #333;
      border: 2px solid rgba(255, 255, 255, 0.2);
      display: grid;
      place-items: center;
      font-size: 40px;
      flex-shrink: 0;
    }

    .profile-info h2 {
      margin: 0 0 5px;
      font-size: clamp(22px, 4vw, 28px);
    }

    .profile-info p {
      margin: 0;
      opacity: 0.8;
      color: #b0bec5;
    }

    .profile-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .stat-item {
      background: rgba(0, 0, 0, 0.25);
      padding: 16px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .stat-item .label {
      font-size: 13px;
      opacity: 0.7;
      margin-bottom: 8px;
      display: block;
    }

    .stat-item .value {
      font-size: 24px;
      font-weight: bold;
      color: #7be0b0;
    }

    .profile-actions {
      display: flex;
      gap: 12px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body class="page-scrollable">
  <!-- Elementos de fondo de la landing page -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-grid"></div>

  <!-- Barra de navegación superior -->
  <header class="topbar">
    <a href="/home" class="brand">
      <img src="/assets/trionda_ball.png" alt="Balón WorldScan 2026" class="brand-ball" />
      <div class="brand-text">
        <span class="brand-title">WorldScan</span>
        <span class="brand-year">2026</span>
      </div>
    </a>
    <a href="/scanner" class="topbar-btn">Ir al escáner</a>
  </header>

  <!-- Contenido principal -->
  <main>
    <section class="profile-section">
      <div class="profile-card">
        <!-- Cabecera del perfil -->
        <div class="profile-header">
          <div class="profile-avatar" aria-label="Avatar de usuario">👤</div>
          <div class="profile-info">
            <h2>Nombre de Usuario</h2>
            <p>usuario@email.com</p>
          </div>
        </div>

        <!-- Estadísticas del usuario -->
        <div class="profile-stats">
          <div class="stat-item">
            <span class="label">Banderas Escaneadas</span>
            <span class="value">5 / 10</span>
          </div>
          <div class="stat-item">
            <span class="label">Puntos Rewards</span>
            <span class="value">1,250</span>
          </div>
          <div class="stat-item">
            <span class="label">Trivias Completadas</span>
            <span class="value">3</span>
          </div>
        </div>

        <!-- Acciones del perfil -->
        <div class="profile-actions">
          <button class="primary-btn" type="button">Editar Perfil</button>
          <button class="secondary-btn" type="button">Cerrar Sesión</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>WorldScan 2026 · Experiencia WebAR del Mundial 2026</p>
    <a href="/scanner" class="footer-link">Abrir escáner</a>
  </footer>
</body>
</html>
