<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Escáner AR — Mundial 2026</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<!--   <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/landing.css" />
 -->
 <link rel="stylesheet" href="/css/design.css" />
  <style>
  #fx-stars{
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    pointer-events: none;
    opacity: 0;
    z-index: 9999;
    transition: opacity .25s ease;
  }

  #fx-stars.show{
    opacity: .95;
  }
</style>
</head>

<body>

  <header class="topbar">
    <a href="/profile" class="topbar-btn">👤</a>
    <a href="/home" class="brand">
      <img src="/assets/trionda_ball.png" alt="Balón WorldScan 2026" class="brand-ball" />
      <div class="brand-text">
        <span class="brand-title">WorldScan</span>
        <span class="brand-year">2026</span>
      </div>
    </a>
    <a href="/store" class="topbar-btn">🎁</a>
  </header>

  <!-- Filtro SVG para efecto Pixelado Real -->
  <svg style="position: absolute; width: 0; height: 0;" aria-hidden="true">
    <defs>
      <filter id="pixelate-effect">
        <feFlood x="4" y="4" height="2" width="2"/>
        <feComposite width="10" height="10"/>
        <feTile result="a"/>
        <feComposite in="SourceGraphic" in2="a" operator="in"/>
        <feMorphology id="pixel-morph" operator="dilate" radius="5"/>
      </filter>
    </defs>
  </svg>

  <!-- HUD inferior — oculto por defecto -->
  <div id="hud" class="hud" aria-label="Menú AR">
  <button class="hud-btn" type="button" data-modal-name="modal-video" title="Video Oficial">🎥</button>
  <button class="hud-btn" type="button" data-modal-name="modal-stats" title="Estadísticas">📊</button>
  <button class="hud-btn" type="button" data-modal-name="modal-estadio" title="Información del Estadio">🏟</button>
  <button class="hud-btn" type="button" data-modal-name="modal-trivia" title="Trivia">🎮</button>
    <a class="hud-btn" href="/rewards" target="_blank" rel="noopener noreferrer" title="Rewards">💵</a>
    <button class="hud-btn" id="btn-ar-animation" type="button" title="Activar animación">✨</button>
  </div>

  <!-- Botón de Ajustes de Cámara -->
  <button id="btn-camera-settings" class="btn hidden" aria-label="Ajustes de cámara">⚙️</button>

  <!-- Selector Manual de Cámaras (Debug) -->
  <div id="camera-selector" class="camera-selector hidden">
    <h4>Lentes del Dispositivo</h4>
    <div id="camera-list"></div>
    <div id="zoom-container" class="hidden" style="margin-top: 10px; text-align: center;">
      <h4>Zoom Lógico</h4>
      <input type="range" id="zoom-slider" min="1" max="5" step="0.1" value="1" style="width: 100%;">
    </div>
    <div id="exposure-container" class="hidden" style="margin-top: 10px; text-align: center;">
      <h4>Exposición</h4>
      <input type="range" id="exposure-slider" min="-3" max="3" step="0.1" value="0" style="width: 100%;">
    </div>
  </div>

  <!-- Overlay de partículas -->
  <img id="fx-stars" src="/assets/img/estrellas.gif" alt="" aria-hidden="true" />

  <!-- Contenedor para los modales que se cargarán dinámicamente -->
  <div id="modal-container"></div>

  <!-- AR Scene -->
  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: /assets/targets.mind; autoStart: true; uiScanning: yes; uiLoading: yes; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 5;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
  <a-assets>
  <a-asset-item id="soccerBallGLB" src="/assets/classic_soccer_ball_new.glb"></a-asset-item>
</a-assets>
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      cursor="fuse: false; rayOrigin: mouse;"
      raycaster="far: 10000; objects: .clickable"
    ></a-camera>
  </a-scene>

 <script src="/js/db-service.js"></script>
<script src="/js/triviaData.js"></script>
<script src="/js/trivia.js"></script>
<script src="/js/statsData.js"></script>
<script src="/js/stats.js"></script>
<script src="/js/stadiumData.js"></script>
<script src="/js/stadium.js"></script>
<script src="/js/modals.js"></script>
<script src="/js/script.js"></script>

</body>
</html>
